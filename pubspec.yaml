name: mixtape
description: Mixtape for Android - your tapes, YouTube Music and the cassette look, in your pocket.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audio_service: ^0.18.19
  audio_session: ^0.2.2
  crypto: ^3.0.6
  http: ^1.5.0
  just_audio: ^0.10.6
  path_provider: ^2.1.5
  rxdart: ^0.28.0
  mixtape_native:
    path: packages/mixtape_native

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700
    - family: Barlow Condensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
    - family: Covered By Your Grace
      fonts:
        - asset: assets/fonts/CoveredByYourGrace.ttf
