name: mixtape_native
description: The parts of Mixtape that live on the phone's own side - YouTube through NewPipe's extractor on Android, sharing, picking pictures and the home screen widgets.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.softwarevault.mixtape_native
        pluginClass: MixtapeNativePlugin
      ios:
        pluginClass: MixtapeNativePlugin
