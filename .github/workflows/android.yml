# Builds Mixtape for Android on every push: checks the code, runs the tests, builds the APK and puts it
# in a GitHub release named after the version in pubspec.yaml (a new version, a new release; the same
# version again, its APK is replaced).
#
# Signing: with the repository secrets ANDROID_KEYSTORE (the .jks file, base64), ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD the APK is signed with that key, so every new APK installs
# over the last one. Without them it's signed with a throwaway debug key.
name: Android

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties', 'packages/mixtape_native/android/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      # The files Flutter makes for every Android app and that aren't kept in git (the Gradle wrapper,
      # mostly). Files that are here already stay as they are.
      - name: Fill in the generated files
        run: flutter create --platforms=android --org dev.softwarevault --project-name mixtape .

      - run: flutter pub get

      - name: Check the code
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > android/app/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
            echo "Signing with the release key"
          else
            echo "No release key in the secrets: a debug-signed APK"
          fi

      - name: Build the APK
        run: flutter build apk --release --target-platform android-arm,android-arm64

      - name: Name it
        id: name
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cp build/app/outputs/flutter-apk/app-release.apk "Mixtape-$version.apk"
          ls -la "Mixtape-$version.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Mixtape-${{ steps.name.outputs.version }}
          path: Mixtape-${{ steps.name.outputs.version }}.apk

      - name: Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.name.outputs.version }}
        run: |
          notes="Mixtape $VERSION for Android. Install Mixtape-$VERSION.apk on your phone (Android 7 or newer)."
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "Mixtape-$VERSION.apk" --clobber
          else
            gh release create "v$VERSION" "Mixtape-$VERSION.apk" --target "$GITHUB_SHA" \
              --title "Mixtape $VERSION for Android" --notes "$notes"
          fi
